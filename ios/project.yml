# XcodeGen-Spezifikation fuer die SwiftUI-App Preisfuchs.
# Erzeugen: cd ios && xcodegen generate  (das .xcodeproj ist gitignored)
name: Preisfuchs
options:
  bundleIdPrefix: de.preisfuchs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  # Exakt gepinnt, weil Package.resolved mit dem .xcodeproj nicht im Repo liegt.
  # v2.55.3 per `git ls-remote --tags` am 10.10.2026 bestaetigt.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3
  PreisfuchsKit:
    path: Packages/PreisfuchsKit
targets:
  Preisfuchs:
    type: application
    platform: iOS
    sources: [Preisfuchs]
    info:
      path: Preisfuchs/Info.plist
      properties:
        CFBundleDisplayName: Preisfuchs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PFSupabaseHost: $(SUPABASE_HOST)
        PFSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [preisfuchs]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.shopping
    settings:
      base:
        # Ueberschreibbar ueber PF_BUNDLE_ID / DEVELOPMENT_TEAM in Config/Secrets.xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(PF_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: PreisfuchsKit
        product: PreisfuchsDomain
      - package: PreisfuchsKit
        product: PreisfuchsData
      - package: Supabase
        product: Supabase
  PreisfuchsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PreisfuchsTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Preisfuchs
schemes:
  Preisfuchs:
    build:
      targets:
        Preisfuchs: all
    test:
      targets:
        - PreisfuchsTests
        - package: PreisfuchsKit/PreisfuchsDomainTests
        - package: PreisfuchsKit/PreisfuchsDataTests
