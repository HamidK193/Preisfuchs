version: 2
# Monthly, one grouped pull request per ecosystem, to keep notification mail low.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend/jobs
    schedule:
      interval: monthly
      time: "05:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
