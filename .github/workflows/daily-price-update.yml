name: Daily price update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --requirement backend/jobs/requirements.txt

      - name: Verify catalog and import rules
        run: python -m unittest discover -s backend/jobs -p 'test_*.py' -v

      - name: Run update job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPEN_PRICES_BASE_URL: https://prices.openfoodfacts.org
        run: python backend/jobs/price_update_job.py

      # All new German observations from Open Prices, auto-verified, kaufDA only as internal last check.
      - name: Run Open Prices DE agent
        if: always()
        working-directory: backend/jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python open_prices_de_agent.py

      - name: Write import summary
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path('artifacts/latest-import.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              if path.exists():
                  report = json.loads(path.read_text(encoding='utf-8'))['report']
                  summary.write('```json\n' + json.dumps(report, indent=2, ensure_ascii=False) + '\n```\n')
              else:
                  summary.write('Import stopped before a report was written. Check the failed step.\n')
