name: Daily price update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Reload all German Open Prices of the last N days once (0 = normal run, max 90)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --requirement backend/jobs/requirements.txt

      - name: Verify catalog and import rules
        run: python -m unittest discover -s backend/jobs -p 'test_*.py' -v

      # Legacy BW seed import stays off unless the repository variable opts in.
      - name: Run update job (BW seed)
        if: ${{ vars.ENABLE_BW_SEED_JOB == 'true' }}
        env:
          ENABLE_BW_SEED_JOB: ${{ vars.ENABLE_BW_SEED_JOB || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPEN_PRICES_BASE_URL: https://prices.openfoodfacts.org
        run: python backend/jobs/price_update_job.py

      # All new German observations from Open Prices, auto-verified, kaufDA only as internal last check.
      - name: Run Open Prices DE agent
        if: always()
        working-directory: backend/jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPEN_PRICES_BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
        run: python open_prices_de_agent.py

      # Fills the catalog: German supermarket products with name, brand, quantity, category, GTIN and
      # front image from Open Food Facts (ODbL, images CC BY-SA). Stops itself after 30 minutes and
      # continues at the saved position on the next run.
      - name: Run Open Food Facts catalog agent
        if: always()
        working-directory: backend/jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFF_CATALOG_MAX_SECONDS: "1800"
        run: python off_catalog_agent.py

      # Public prices older than 90 days become non-public (review reason too_old).
      - name: Expire stale public prices
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/expire_stale_price_observations" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d '{}'

      - name: Write import summary
        if: ${{ always() && vars.ENABLE_BW_SEED_JOB == 'true' }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path('artifacts/latest-import.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              if path.exists():
                  report = json.loads(path.read_text(encoding='utf-8'))['report']
                  summary.write('```json\n' + json.dumps(report, indent=2, ensure_ascii=False) + '\n```\n')
              else:
                  summary.write('Import stopped before a report was written. Check the failed step.\n')

      - name: Create issue for failed price update
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Daily price update failed" \
            --body "Workflow run failed: $RUN_URL"
